<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fff8ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Draw Pad — draw and trace dinosaurs">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Draw Pad</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="canvasWrap">
      <canvas id="stencilCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
      <canvas id="fxCanvas"></canvas>

      <!-- Kept off the toolbar and away from the drawing controls, so the
           destructive ones are hard to hit by accident. -->
      <div id="floatTools">
        <button id="undoBtn" class="float-btn" aria-label="Undo">↩</button>
        <button id="clearBtn" class="float-btn hold-btn" aria-label="Clear — press and hold">🗑</button>
        <button id="saveBtn" class="float-btn hold-btn" aria-label="Save picture — press and hold">💾</button>
        <button id="muteBtn" class="float-btn" aria-label="Sound on or off">🔊</button>
      </div>
    </div>

    <div id="toolbar">
      <div id="colors">
        <button class="c-btn" data-color="#ff3b30" style="background:#ff3b30" aria-label="Red"></button>
        <button class="c-btn" data-color="#ff9500" style="background:#ff9500" aria-label="Orange"></button>
        <button class="c-btn" data-color="#ffcc00" style="background:#ffcc00" aria-label="Yellow"></button>
        <button class="c-btn" data-color="#34c759" style="background:#34c759" aria-label="Green"></button>
        <button class="c-btn" data-color="#007aff" style="background:#007aff" aria-label="Blue"></button>
        <button class="c-btn" data-color="#af52de" style="background:#af52de" aria-label="Purple"></button>
        <button class="c-btn" data-color="#ff2d92" style="background:#ff2d92" aria-label="Pink"></button>
        <button class="c-btn" data-color="#1c1c1e" style="background:#1c1c1e" aria-label="Black"></button>
        <button class="c-btn rainbow-btn" data-color="rainbow" aria-label="Rainbow"></button>
      </div>

      <div id="tools">
        <button class="size-btn" data-size="8" aria-label="Thin"><span class="dot" style="--d:9px"></span></button>
        <button class="size-btn active" data-size="18" aria-label="Medium"><span class="dot" style="--d:17px"></span></button>
        <button class="size-btn" data-size="34" aria-label="Thick"><span class="dot" style="--d:26px"></span></button>
        <button class="tool-btn" data-mode="fill" aria-label="Fill">🪣</button>
        <button class="tool-btn" data-toggle="magic" aria-label="Magic sparkles">✨</button>
        <button class="tool-btn" id="stampsBtn" aria-label="Stickers">⭐</button>
        <button class="tool-btn" id="dinosBtn" aria-label="Dinosaurs">🦖</button>
      </div>
    </div>

    <!-- Full-screen pickers: choosing what to draw is its own moment, and it
         gets the whole screen instead of a cramped strip. -->
    <div id="stencilPicker" class="picker hidden">
      <div class="picker-grid" id="stencilGrid"></div>
      <button class="picker-close" aria-label="Back">✓</button>
    </div>

    <div id="stampPicker" class="picker hidden">
      <div class="picker-grid" id="stampGrid"></div>
      <div class="picker-sizes">
        <button class="stamp-size-btn" data-stampsize="40" aria-label="Small sticker"><span class="dot" style="--d:14px"></span></button>
        <button class="stamp-size-btn active" data-stampsize="72" aria-label="Medium sticker"><span class="dot" style="--d:22px"></span></button>
        <button class="stamp-size-btn" data-stampsize="120" aria-label="Big sticker"><span class="dot" style="--d:32px"></span></button>
      </div>
      <button class="picker-close" aria-label="Back">✓</button>
    </div>
  </div>

  <script src="js/sound.js"></script>
  <script src="js/stencils.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
